<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Luar Circus — Demo WebCore</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3fa;color:#38294b;font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:24px}a{color:inherit}header{background:#372b4b;color:white;padding:28px;border-radius:18px;margin:20px 0}h1,h2{margin:0 0 12px}small{display:block}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,input,select{font:inherit;padding:10px;border:1px solid #cbbdd7;border-radius:8px}button{cursor:pointer;background:#fff;color:#38294b}button.active,button.primary{background:#59416e;color:white}section{background:white;border:1px solid #e6ddec;padding:20px;border-radius:14px;margin:12px 0}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats div{flex:1;min-width:120px;background:#eee6f5;padding:16px;border-radius:12px}.stats strong{display:block;font-size:28px}form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}label{display:block;margin:8px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.item span{overflow-wrap:anywhere}footer{margin-top:20px}p{overflow-wrap:anywhere}</style></head><body><main><a href="/#portfolio">← Voltar ao portfólio</a><header><small>☾ LUAR CIRCUS · AMBIENTE DEMONSTRATIVO</small><h1>Agenda &amp; chamadas</h1><p>Experimente o sistema com dados fictícios. Nada é enviado à nuvem. Não insira dados pessoais reais.</p></header><nav id="nav"><button data-view="home" class="active">Visão geral</button><button data-view="students">Alunas</button><button data-view="groups">Turmas</button><button data-view="calendar">Calendário</button><button data-view="attendance">Chamadas</button></nav><section id="view"></section><button id="reset">Reiniciar demonstração</button><footer><a href="/#orcamento">Quero um sistema como este ↗</a></footer></main><script>
'use strict';const key='webcore-luar-demo-v1',groups=['Azul','Laranja','Verde','Rosa','Vermelha'],schedule=['Terça e quinta · 14h','Terça e quinta · 15h','Terça e quarta · 16h','Terça 17h e quarta 15h','Quarta 14h e quinta 16h'];const fresh=()=>({students:groups.flatMap((group,i)=>[1,2].map(n=>({id:i*2+n,name:'Aluna fictícia '+(i*2+n),group}))),attendance:{},events:[]});let db=fresh();try{const d=JSON.parse(localStorage.getItem(key));if(d&&Array.isArray(d.students)&&Array.isArray(d.events)&&d.attendance)db=d}catch{}let current='home';const root=document.getElementById('view');function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{}}function el(tag,txt,parent){const e=document.createElement(tag);e.textContent=txt;if(parent)parent.append(e);return e}function options(select){groups.forEach(g=>{let o=el('option',g,select);o.value=g})}function btn(txt,parent,fn){let b=el('button',txt,parent);b.type='button';b.onclick=fn;return b}function render(){root.replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===current));el('h2',({home:'Visão geral',students:'Alunas',groups:'Turmas',calendar:'Calendário',attendance:'Chamadas'})[current],root);if(current==='home'){let s=el('div','',root);s.className='stats';[[db.students.length,'Alunas fictícias'],[groups.length,'Turmas'],[Object.values(db.attendance).filter(Boolean).length,'Presenças']].forEach(([n,t])=>{let a=el('div','',s);el('strong',String(n),a);el('span',t,a)});el('p','Explore as funções pelo menu acima.',root)}
if(current==='students'){let form=el('form','',root),name=el('input','',form);name.placeholder='Nome fictício';name.required=true;name.maxLength=80;name.setAttribute('aria-label','Nome fictício');let group=el('select','',form);group.setAttribute('aria-label','Turma');options(group);let b=el('button','Cadastrar',form);b.className='primary';form.onsubmit=e=>{e.preventDefault();if(!name.value.trim()||db.students.length>=100)return;db.students.push({id:Date.now(),name:name.value.trim(),group:group.value});save();render()};db.students.forEach(s=>{let r=el('div','',root);r.className='item';el('span',s.name,r);let g=el('select','',r);options(g);g.value=s.group;g.onchange=()=>{s.group=g.value;save()};btn('Remover',r,()=>{db.students=db.students.filter(x=>x.id!==s.id);save();render()})})}
if(current==='groups'||current==='calendar'){groups.forEach((g,i)=>{let r=el('div','',root);r.className='item';el('strong','Turma '+g,r);el('span',current==='groups'?db.students.filter(s=>s.group===g).length+' alunas':schedule[i],r)});if(current==='calendar'){let f=el('form','',root),d=el('input','',f);d.type='date';d.required=true;let t=el('input','',f);t.placeholder='Anotação fictícia';t.maxLength=100;t.required=true;el('button','Adicionar',f);f.onsubmit=e=>{e.preventDefault();if(db.events.length>=100)return;db.events.push({date:d.value,title:t.value});save();render()};db.events.forEach(e=>el('p',e.date+' · '+e.title,root))}}
if(current==='attendance'){let g=el('select','',root);options(g);let d=el('input','',root);d.type='date';d.value=new Date().toISOString().slice(0,10);let list=el('div','',root);function draw(){list.replaceChildren();db.students.filter(s=>s.group===g.value).forEach(s=>{let r=el('label','',list);let c=el('input','',r);c.type='checkbox';let k=d.value+'-'+s.id;c.checked=!!db.attendance[k];c.onchange=()=>{db.attendance[k]=c.checked;save()};r.append(document.createTextNode(' '+s.name+' — Presente'))})}g.onchange=draw;d.onchange=draw;draw()}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current=b.dataset.view;render()});document.getElementById('reset').onclick=()=>{db=fresh();save();current='home';render()};render();
</script></body></html>
