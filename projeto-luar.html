<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Luar Circus — Demo WebCore</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3fa;color:#38294b;font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:24px}a{color:inherit}header{background:#372b4b;color:white;padding:28px;border-radius:18px;margin:20px 0}h1,h2{margin:0 0 12px}small{display:block}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,input,select{font:inherit;padding:10px;border:1px solid #cbbdd7;border-radius:8px}button{cursor:pointer;background:#fff;color:#38294b}button.active,button.primary{background:#59416e;color:white}section{background:white;border:1px solid #e6ddec;padding:20px;border-radius:14px;margin:12px 0}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats div{flex:1;min-width:120px;background:#eee6f5;padding:16px;border-radius:12px}.stats strong{display:block;font-size:28px}form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}label{display:block;margin:8px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.item span{overflow-wrap:anywhere}footer{margin-top:20px}p{overflow-wrap:anywhere}body{background:#f5f3f8}main{max-width:1250px;padding:28px}header{background:linear-gradient(120deg,#30223f,#59416e);padding:30px}nav{gap:10px}nav button{flex:1;font-weight:600}section{min-height:320px;box-shadow:0 8px 28px #38294b09}.stats div{border-left:4px solid #8062a1}.item{display:grid;grid-template-columns:1fr auto auto;gap:12px}.group-card{border-left:5px solid var(--group);padding:16px;background:#faf8fc;border-radius:10px;margin:10px 0}.group-card h3{margin:0 0 6px}.group-card p{margin:6px 0}.guide{background:#eee6f5;padding:12px 16px;border-radius:10px;font-size:14px}.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.day{background:#f5f0fa;padding:12px;border-radius:10px;min-height:150px}.day button{display:block;width:100%;margin:8px 0;text-align:left;border-left:4px solid var(--group)}@media(max-width:650px){main{padding:14px}.week{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr 1fr}.item span{grid-column:1/-1}nav button{flex:1 1 130px}form input,form select{max-width:100%}}</style></head><body><main><a href="/#portfolio">← Voltar ao portfólio</a><header><small>☾ LUAR CIRCUS · AMBIENTE DEMONSTRATIVO</small><h1>Agenda &amp; chamadas</h1><p>Experimente o sistema com dados fictícios. Nada é enviado à nuvem. Não insira dados pessoais reais.</p></header><nav id="nav"><button data-view="home" class="active">Visão geral</button><button data-view="students">Alunas</button><button data-view="groups">Turmas</button><button data-view="calendar">Calendário</button><button data-view="attendance">Chamadas</button></nav><section id="view"></section><button id="reset">Reiniciar demonstração</button><footer><a href="/#orcamento">Quero um sistema como este ↗</a></footer></main><script>
'use strict';const key='webcore-luar-demo-v1',groups=['Azul','Laranja','Verde','Rosa','Vermelha'],schedule=['Terça e quinta · 14h','Terça e quinta · 15h','Terça e quarta · 16h','Terça 17h e quarta 15h','Quarta 14h e quinta 16h'];const fresh=()=>({students:groups.flatMap((group,i)=>[1,2].map(n=>({id:i*2+n,name:'Aluna fictícia '+(i*2+n),group}))),attendance:{},events:[]});let db=fresh();try{const d=JSON.parse(localStorage.getItem(key));if(d&&Array.isArray(d.students)&&Array.isArray(d.events)&&d.attendance)db=d}catch{}let current='home',selectedGroup='Azul',selectedDate=new Date().toLocaleDateString('en-CA');const colors=['#4386db','#e89038','#45a76a','#d76caa','#dc5252'];function go(view,group){if(group)selectedGroup=group;current=view;render()}const root=document.getElementById('view');function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{}}function el(tag,txt,parent){const e=document.createElement(tag);e.textContent=txt;if(parent)parent.append(e);return e}function options(select){groups.forEach(g=>{let o=el('option',g,select);o.value=g})}function btn(txt,parent,fn){let b=el('button',txt,parent);b.type='button';b.onclick=fn;return b}function render(){root.replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===current));el('h2',({home:'Visão geral',students:'Alunas',groups:'Turmas',calendar:'Calendário',attendance:'Chamadas'})[current],root);if(current==='home'){let s=el('div','',root);s.className='stats';[[db.students.length,'Alunas fictícias'],[groups.length,'Turmas'],[Object.values(db.attendance).filter(Boolean).length,'Presenças']].forEach(([n,t])=>{let a=el('div','',s);el('strong',String(n),a);el('span',t,a)});let guide=el('p','Fluxo: cadastre uma aluna → escolha a turma → consulte o calendário → registre a presença. Os indicadores mudam automaticamente.',root);guide.className='guide';btn('Cadastrar aluna',root,()=>go('students'));btn('Ver calendário',root,()=>go('calendar'));groups.forEach((g,i)=>{let r=el('div','',root);r.className='group-card';r.style.setProperty('--group',colors[i]);el('strong','Turma '+g+' · '+db.students.filter(s=>s.group===g).length+' alunas',r);el('p',schedule[i],r);btn('Abrir chamada',r,()=>go('attendance',g))})}
if(current==='students'){let form=el('form','',root),name=el('input','',form);name.placeholder='Nome fictício';name.required=true;name.maxLength=80;name.setAttribute('aria-label','Nome fictício');let group=el('select','',form);group.setAttribute('aria-label','Turma');options(group);let b=el('button','Cadastrar',form);b.className='primary';form.onsubmit=e=>{e.preventDefault();if(!name.value.trim()||db.students.length>=100)return;db.students.push({id:Date.now(),name:name.value.trim(),group:group.value});save();render()};db.students.forEach(s=>{let r=el('div','',root);r.className='item';el('span',s.name,r);let g=el('select','',r);options(g);g.value=s.group;g.onchange=()=>{s.group=g.value;save()};btn('Remover',r,()=>{db.students=db.students.filter(x=>x.id!==s.id);Object.keys(db.attendance).filter(k=>k.endsWith('-'+s.id)).forEach(k=>delete db.attendance[k]);save();render()})})}
if(current==='groups'||current==='calendar'){if(current==='groups'){groups.forEach((g,i)=>{let r=el('div','',root);r.className='group-card';r.style.setProperty('--group',colors[i]);let members=db.students.filter(s=>s.group===g);el('h3','Turma '+g+' · '+members.length+' alunas',r);el('p',schedule[i],r);el('p',members.map(s=>s.name).join(' • ')||'Nenhuma aluna cadastrada',r);btn('Registrar presença',r,()=>go('attendance',g))})}else{let w=el('div','',root);w.className='week';let days=['Segunda','Terça','Quarta','Quinta','Sexta'],slots=[[],[[0,'14h'],[1,'15h'],[2,'16h'],[3,'17h']],[[4,'14h'],[3,'15h'],[2,'16h']],[[0,'14h'],[1,'15h'],[4,'16h']],[]];days.forEach((day,i)=>{let d=el('div','',w);d.className='day';el('strong',day,d);if(!slots[i].length)el('p','Sem aulas',d);slots[i].forEach(([n,t])=>{let b=btn(t+' · '+groups[n]+' ('+db.students.filter(s=>s.group===groups[n]).length+')',d,()=>{let date=new Date();date.setDate(date.getDate()+((i+1-date.getDay()+7)%7));selectedDate=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');go('attendance',groups[n])});b.style.setProperty('--group',colors[n])})})}if(current==='calendar'){let f=el('form','',root),d=el('input','',f);d.type='date';d.required=true;let t=el('input','',f);t.placeholder='Anotação fictícia';t.maxLength=100;t.required=true;el('button','Adicionar',f);f.onsubmit=e=>{e.preventDefault();if(db.events.length>=100)return;db.events.push({date:d.value,title:t.value});save();render()};db.events.forEach(e=>el('p',e.date+' · '+e.title,root))}}
if(current==='attendance'){let g=el('select','',root);options(g);g.value=selectedGroup;let d=el('input','',root);d.type='date';d.value=selectedDate;let list=el('div','',root);function draw(){list.replaceChildren();db.students.filter(s=>s.group===g.value).forEach(s=>{let r=el('label','',list);let c=el('input','',r);c.type='checkbox';let k=d.value+'-'+s.id;c.checked=!!db.attendance[k];c.onchange=()=>{db.attendance[k]=c.checked;save()};r.append(document.createTextNode(' '+s.name+' — Presente'))})}g.onchange=()=>{selectedGroup=g.value;draw()};d.onchange=()=>{selectedDate=d.value;draw()};draw()}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current=b.dataset.view;render()});document.getElementById('reset').onclick=()=>{db=fresh();save();current='home';render()};render();
</script></body></html>
